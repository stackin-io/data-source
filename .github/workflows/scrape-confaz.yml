name: scrape-confaz

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-data-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_SOURCE_LOG_LEVEL: INFO
      DATA_SOURCE_TIMEOUT_S: "90"
      DATA_SOURCE_MAX_RETRIES: "6"
      DATA_SOURCE_RETRY_MAX_WAIT_S: "120"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Scrape CONFAZ CEST
        run: poetry run data-source scrape confaz/cest --out ./data

      - name: Commit new files as stackin-bot
        run: .github/scripts/commit-data.sh confaz
