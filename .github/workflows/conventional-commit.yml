name: Conventional commit

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      base:
        description: Branch the pull request targets
        required: true
        default: master

permissions:
  contents: read
  statuses: write

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actionplatform/ci-github/conventional-commit@v1
        with:
          base: ${{ github.event.pull_request.base.sha || format('origin/{0}', inputs.base) }}
      - name: Report the result on the commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state="$STATE" -f context=conventional-commit
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
