name: Git-flow

on:
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:
    inputs:
      base:
        description: Branch the pull request targets
        required: true
        default: master

permissions:
  contents: read
  statuses: write

jobs:
  gitflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actionplatform/ci-github/gitflow@v1
        with:
          head: ${{ github.head_ref || github.ref_name }}
          base: ${{ github.base_ref || inputs.base }}
      - name: Report the result on the commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state="$STATE" -f context=gitflow
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
