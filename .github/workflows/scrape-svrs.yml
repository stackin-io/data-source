name: scrape-svrs

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-data-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_SOURCE_LOG_LEVEL: INFO
      DATA_SOURCE_TIMEOUT_S: "60"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Scrape NF-e
        run: poetry run data-source scrape svrs/nfe/documentos --out ./data

      - name: Scrape NFC-e
        run: poetry run data-source scrape svrs/nfce/documentos --out ./data

      - name: Scrape CT-e
        run: poetry run data-source scrape svrs/cte/documentos --out ./data

      - name: Scrape MDF-e
        run: poetry run data-source scrape svrs/mdfe/documentos --out ./data

      - name: Scrape BP-e
        run: poetry run data-source scrape svrs/bpe/documentos --out ./data


      - name: Rebuild every feed and the root sitemap
        run: poetry run data-source rebuild-index --out ./data

      - name: Commit new files as stackin-bot
        run: |
          git config user.name "stackin-bot"
          git config user.email "bot@stackin.io"
          git add data/svrs data/manifest.json data/feed.xml
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "DATA(svrs): Scheduled scrape $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
