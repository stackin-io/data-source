name: scrape-nfse

on:
  schedule:
    # every 6h — offset +30min from nfe to avoid parallel push contention
    # 00:30, 06:30, 12:30, 18:30 BRT (UTC-3) = 03:30, 09:30, 15:30, 21:30 UTC
    - cron: "30 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-nfse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_SOURCE_HEADLESS: "true"
      DATA_SOURCE_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Run NFSe scraper
        run: poetry run data-source scrape nfse --out ./data

      - name: Commit new files as stackin-bot
        run: |
          git config user.name "stackin-bot"
          git config user.email "bot@stackin.io"
          git add data/nfse data/manifest.json data/feed.xml
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "🤖 DATA(nfse): Scheduled scrape $(date -u +%Y-%m-%d)"
          git push
