name: scrape-nfse

# The daily NFS-e scrape runs on Jenkins (data-source/scrape-nfse,
# jenkins/Jenkinsfile.scrape-nfse) since 2026-11-21: gov.br resets
# connections from GitHub-hosted runners ([Errno 104]), see issue #24.
# This workflow is disabled and kept for a manual run only.
on:
  workflow_dispatch:

concurrency:
  group: scrape-data-source
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_SOURCE_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Run NFSe scraper
        run: poetry run data-source scrape nfse --out ./data

      - name: Merge new files through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/commit-data.sh nfse

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: .github/scripts/notify-failure.sh
