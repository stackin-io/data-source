name: scrape-nfe

on:
  schedule:
    # every 6h — 00:00, 06:00, 12:00, 18:00 BRT (UTC-3) = 03:00, 09:00, 15:00, 21:00 UTC
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-data-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_SOURCE_HEADLESS: "true"
      DATA_SOURCE_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Run NFe Esquemas XML scraper
        run: poetry run data-source scrape nfe/esquemas-xml --out ./data

      - name: Run NFe Notas Técnicas scraper
        run: poetry run data-source scrape nfe/notas-tecnicas --out ./data

      - name: Run NFe Informes Técnicos scraper
        run: poetry run data-source scrape nfe/informes-tecnicos --out ./data

      - name: Run NFe Diversos scraper
        run: poetry run data-source scrape nfe/diversos --out ./data

      - name: Commit new files as stackin-bot
        run: |
          git config user.name "stackin-bot"
          git config user.email "bot@stackin.io"
          git add data/nfe data/manifest.json data/feed.xml
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "🤖 DATA(nfe): Scheduled scrape $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
