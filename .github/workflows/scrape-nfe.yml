name: scrape-nfe

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-data-source
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_SOURCE_HEADLESS: "true"
      DATA_SOURCE_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-ansi

      - name: Run NFe Esquemas XML scraper
        run: poetry run data-source scrape nfe/esquemas-xml --out ./data

      - name: Run NFe Notas Técnicas scraper
        run: poetry run data-source scrape nfe/notas-tecnicas --out ./data

      - name: Run NFe Informes Técnicos scraper
        run: poetry run data-source scrape nfe/informes-tecnicos --out ./data

      - name: Run NFe Diversos scraper
        run: poetry run data-source scrape nfe/diversos --out ./data

      - name: Run NFe Manuais scraper
        run: poetry run data-source scrape nfe/manuais --out ./data

      - name: Commit new files as stackin-bot
        run: .github/scripts/commit-data.sh nfe
