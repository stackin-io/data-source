name: scrape-rfb-mei

on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-data-source
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_SOURCE_LOG_LEVEL: INFO
      DATA_SOURCE_TIMEOUT_S: "120"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-ansi --only main

      - name: Scrape Receita Anexo XI (MEI occupations)
        run: poetry run data-source scrape rfb/mei-ocupacoes --out ./data

      - name: Merge new files through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/commit-data.sh rfb/mei-ocupacoes

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: .github/scripts/notify-failure.sh
