[tool.poetry]
name = "data-source"
version = "0.1.0"
description = "Scheduled Selenium scraping jobs for NFe/NFSe official docs and XMLs (extendable to other sources)."
authors = ["Stackin <dev@stackin.io>"]
readme = "README.md"
license = "MIT"
packages = [{include = "data_source"}]

[tool.poetry.dependencies]
python = "^3.11"
selenium = "^4.25.0"
webdriver-manager = "^4.0.2"
httpx = "^0.27.2"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
typer = "^0.15.1"
click = ">=8.1,<8.2"
tenacity = "^9.0.0"
structlog = "^24.4.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
mypy = "^1.11.2"
coverage = "^7.6.1"

[tool.poetry.scripts]
data-source = "data_source.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend = ".code_quality/ruff.toml"

[tool.mypy]
config_file = ".code_quality/mypy.ini"
ignore_missing_imports = true

[tool.coverage.run]
source = ["data_source"]
branch = true
