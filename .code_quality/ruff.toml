line-length = 100
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "N",
    "RUF",
]

ignore = [
    "E501",
    "B008",
    "E203",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ARG001", "S101"]

[lint.isort]
known-first-party = ["data_source"]
force-single-line = false

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
